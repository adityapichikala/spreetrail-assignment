databases:
  - name: expense-manager-db
    databaseName: expense_manager
    user: expense_user
    plan: free
services:
  - type: web
    name: shared-expense-management
    env: node
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: expense-manager-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MAX_FILE_SIZE
        value: 10485760
      - key: UPLOAD_DIR
        value: ./uploads
    disk:
      name: uploads
      mountPath: /app/uploads
      sizeGB: 1